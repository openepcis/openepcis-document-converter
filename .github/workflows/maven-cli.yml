# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

# NOTE: Sonar analysis stays disabled until its credentials are fixed.
# A push or pull request to main only builds and tests. The 999-SNAPSHOT is published to GitLab only by the Run workflow button on main.

name: Java CI with Maven

on:
  # normal build and test on every push/pr to main
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-jar-job:
    name: 'Build and test'
    runs-on: ubuntu-latest

    steps:
      - name: checkout from git
        uses: actions/checkout@v3

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'

      - id: build_and_test
        name: build and test
        env:
          SONAR_TOKEN: ${{ secrets.CG_SONAR_LOGIN }}
          GITLAB_MAVEN_USERNAME: ${{ secrets.GITLAB_MAVEN_USERNAME }}
          GITLAB_MAVEN_TOKEN: ${{ secrets.GITLAB_MAVEN_TOKEN }}
        run: |
          mvn -s .mvn/settings.xml --no-transfer-progress --batch-mode -Pcoverage -B clean verify
          # Sonar analysis is disabled due to credentials:
          #  -Psonar \
          #  clean verify sonar:sonar

      # Publish the 999-SNAPSHOT only when started with the Run workflow button on main and build is green above
      - id: publish_snapshot
        name: Publish the 999-SNAPSHOT to the GitLab package registry
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GITLAB_MAVEN_USERNAME: ${{ secrets.GITLAB_DEPLOY_USER }}
          GITLAB_MAVEN_TOKEN: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
        run: mvn -s .mvn/settings.xml --no-transfer-progress --batch-mode -DskipTests deploy